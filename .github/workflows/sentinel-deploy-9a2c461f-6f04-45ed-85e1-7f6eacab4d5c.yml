name: Deploy Content to TestWkSpace [9a2c461f-6f04-45ed-85e1-7f6eacab4d5c]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-9a2c461f-6f04-45ed-85e1-7f6eacab4d5c.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main_SentinelExport_1676508000-sentinel-deployment ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-9a2c461f-6f04-45ed-85e1-7f6eacab4d5c.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'newecotestrg2'
      workspaceName: 'TestWkSpace'
      workspaceId: 'd67b16c8-7718-48cc-bb81-6b1d47ccbc3f'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzurePPE'
      contentTypes: 'AnalyticsRule'
      branch: 'main_SentinelExport_1676508000-sentinel-deployment'
      sourceControlId: '9a2c461f-6f04-45ed-85e1-7f6eacab4d5c'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      if: ${{ env.cloudEnv == 'AzureCloud' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ env.cloudEnv == 'AzureCloud' && steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ env.cloudEnv == 'AzureCloud' && steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ env.cloudEnv == 'AzureCloud' && steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ env.cloudEnv == 'AzureCloud' && steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_9a2c461f6f0445ed85e17f6eacab4d5c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v1
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-9a2c461f-6f04-45ed-85e1-7f6eacab4d5c.ps1